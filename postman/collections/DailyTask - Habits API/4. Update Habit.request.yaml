$kind: http-request
url: "{{baseUrl}}/api/habits/{{habitId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Daily Reading",
      "description": "Read for 30 minutes daily"
    }
scripts:
  - type: afterResponse
    code: pm.test('Habit updated successfully', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
