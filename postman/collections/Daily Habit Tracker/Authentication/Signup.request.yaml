$kind: http-request
description: Confirm the email manually before running Login.
url: "{{baseUrl}}/api/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP status', function () {
        pm.response.to.have.status(202);
      });
    language: text/javascript
order: 1000
