$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP status', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code === 200) {
        pm.collectionVariables.set('accessToken', pm.response.json().data.access_token);
      }
    language: text/javascript
order: 2000
