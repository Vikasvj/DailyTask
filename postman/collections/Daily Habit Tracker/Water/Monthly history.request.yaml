$kind: http-request
url: "{{baseUrl}}/api/water/history?period=month&date={{date}}"
method: GET
queryParams:
  period: month
  date: "{{date}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP status', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
