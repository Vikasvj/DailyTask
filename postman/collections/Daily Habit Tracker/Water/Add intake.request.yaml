$kind: http-request
url: "{{baseUrl}}/api/water/entries"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount_ml": 250
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP status', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code === 201) {
        pm.collectionVariables.set('entryId', pm.response.json().data.id);
      }
    language: text/javascript
order: 3000
